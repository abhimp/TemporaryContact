<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ server_name }}</title>
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ url_for('logo') }}">
  <link rel="apple-touch-icon" href="{{ url_for('logo') }}">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ server_name }}">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <img class="logo" src="{{ url_for('logo') }}" alt="">
      <span>{{ server_name }}</span>
    </a>
    {% if session.get('user') %}
    <nav class="nav">
      <a href="{{ url_for('contacts') }}">Contacts</a>
      <a href="{{ url_for('settings') }}">Settings</a>
      <a href="{{ url_for('logout') }}">Log out</a>
    </nav>
    {% endif %}
  </header>

  <main class="content">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flashes">
          {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // Add the CSRF token to every POST form (server rejects POSTs without it).
    (function () {
      var t = "{{ csrf_token }}";
      Array.prototype.forEach.call(document.querySelectorAll('form[method="post"], form[method="POST"]'),
        function (f) {
          if (!f.querySelector('input[name="_csrf"]')) {
            var i = document.createElement('input');
            i.type = 'hidden'; i.name = '_csrf'; i.value = t;
            f.appendChild(i);
          }
        });
    })();
  </script>
</body>
</html>
